name: immagine
# Il builder GitHub di RunPod si ferma dopo "Creating cache directory" (da un mese): l'immagine si costruisce qui
# e RunPod la scarica gia' pronta da ghcr.io.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: spazio su disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build e push
        run: |
          IMG=ghcr.io/lembodomenico/karaokecreator
          docker build --label org.opencontainers.image.source=https://github.com/lembodomenico/KaraokeCreator \
            -t $IMG:${GITHUB_SHA::7} -t $IMG:latest .
          df -h /
          docker push $IMG:${GITHUB_SHA::7}
          docker push $IMG:latest
